<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="spiderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0055" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Dark Midnight Squircle Background -->
  <rect width="100" height="100" rx="24" fill="#090d16" />
  <rect x="2" y="2" width="96" height="96" rx="22" fill="none" stroke="url(#spiderGlow)" stroke-width="2.5" opacity="0.85" />
  
  <!-- Spider Web Subtle Radial Lines -->
  <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="1">
    <circle cx="50" cy="50" r="16" fill="none"/>
    <circle cx="50" cy="50" r="30" fill="none"/>
    <circle cx="50" cy="50" r="42" fill="none"/>
    <line x1="50" y1="50" x2="12" y2="12"/>
    <line x1="50" y1="50" x2="88" y2="12"/>
    <line x1="50" y1="50" x2="12" y2="88"/>
    <line x1="50" y1="50" x2="88" y2="88"/>
  </g>

  <!-- Spider-Verse Dual-Tone Logo (Miles Crimson & 2099 Electric Cyan) -->
  <g filter="url(#neonGlow)">
    <!-- Spider Body & Abdomen -->
    <ellipse cx="50" cy="41" rx="6" ry="8" fill="#ef4444" />
    <ellipse cx="50" cy="57" rx="8" ry="13" fill="#ff0055" />
    <!-- Spider Head -->
    <ellipse cx="50" cy="30" rx="4" ry="3.5" fill="#ffffff" />
    
    <!-- Top Left Legs (Crimson) -->
    <path d="M47 37 Q32 18 21 23 Q19 25 22 28 Q30 25 44 41 Z" fill="#ef4444" />
    <path d="M45 43 Q26 34 14 43 Q13 45 16 47 Q26 40 43 46 Z" fill="#ef4444" />
    
    <!-- Top Right Legs (Cyan) -->
    <path d="M53 37 Q68 18 79 23 Q81 25 78 28 Q70 25 56 41 Z" fill="#00f0ff" />
    <path d="M55 43 Q74 34 86 43 Q87 45 84 47 Q74 40 57 46 Z" fill="#00f0ff" />
    
    <!-- Bottom Left Legs (Crimson) -->
    <path d="M45 51 Q23 54 15 70 Q14 72 17 73 Q26 59 44 55 Z" fill="#ef4444" />
    <path d="M46 61 Q29 76 27 89 Q28 91 31 89 Q34 78 47 65 Z" fill="#ef4444" />
    
    <!-- Bottom Right Legs (Cyan) -->
    <path d="M55 51 Q77 54 85 70 Q86 72 83 73 Q74 59 56 55 Z" fill="#00f0ff" />
    <path d="M54 61 Q71 76 73 89 Q72 91 69 89 Q66 78 53 65 Z" fill="#00f0ff" />
  </g>
  
  <!-- Glowing Center Spider-Sense Crystal Core -->
  <polygon points="50,45 52.5,49 50,53 47.5,49" fill="#ffffff" />
</svg>
